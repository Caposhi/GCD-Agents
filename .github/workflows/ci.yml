name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Node 22 offline quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Offline self-tests
        run: npm run test:offline

      - name: Simulated dry run
        run: npm run dryrun

      - name: Deployment-controller fixture tests
        run: npm run test:deployment-controller

      - name: Markdown links
        run: npm run check:markdown-links

      - name: Environment-variable coverage
        run: npm run check:env-coverage

      - name: Credential and PII scan (safe output)
        run: npm run scan:sensitive

      - name: Repository whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Production dependency audit
        run: npm audit --omit=dev

  postgres-integration:
    name: PostgreSQL ${{ matrix.postgres-version }} integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ["16", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gcd_social_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gcd_social_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build integration artifacts
        run: npm run build

      - name: Phase 0A disposable PostgreSQL harness
        env:
          PHASE0A_DISPOSABLE_POSTGRES: "1"
          PHASE0A_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: npm run test:postgres

      - name: Migrate dedicated HTTP test database
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gcd_social_ci
        run: npm run migrate

      - name: Bound API HTTP integration suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/gcd_social_ci
        run: npm run test:http-e2e

  agentshield:
    name: AgentShield 1.4.0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: AgentShield scan
        run: npx --yes ecc-agentshield@1.4.0 scan --path . --format json > agentshield-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentshield-report
          path: agentshield-report.json
          if-no-files-found: warn

  workflow-static:
    name: Workflow and YAML static validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned actionlint 1.7.12
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --show-error --silent --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint"
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Validate GitHub Actions workflows
        run: actionlint -color

      - name: Parse checked-in YAML
        run: ruby -e 'require "yaml"; ARGV.each { |file| YAML.load_file(file); puts "parsed #{file}" }' render.yaml .github/workflows/*.yml
