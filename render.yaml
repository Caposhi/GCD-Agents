# GCD-SOCIAL — Render Blueprint
# Web service (trigger/webhook receiver) + background worker (long-running orchestration) + Postgres.
# NOTE: set all real secrets in the Render dashboard or as a secret group, NOT here. This file is committed.
# Phase 0D intentionally does not change live auto-deploy. Follow docs/DEPLOYMENT.md to disable
# native auto-deploy on all three services before enabling the GitHub deployment controller.

databases:
  - name: gcd-social-db
    databaseName: gcd_social
    plan: basic-256mb        # Verify current availability, pricing, retention, and capacity in Render before deployment.
    # stores: agent state, approval queue, brand scorecard, self-improvement proposal lineage

services:
  # 1) Trigger receiver — accepts scheduled triggers / manual kickoffs / approval callbacks.
  - type: web
    name: gcd-social-api
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:api
    preDeployCommand: npm run migrate   # auto-apply DB migrations on every deploy
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS            # cap V8 heap under the 512MB instance limit (avoid OOM)
        value: --max-old-space-size=400
      - key: DATABASE_URL
        fromDatabase:
          name: gcd-social-db
          property: connectionString
      - key: CONSOLE_TOKEN
        sync: false          # required to protect /triggers, /diag/*, and /console/*
      # Provider credentials retained on the API only for authenticated diagnostics.
      - key: IG_USER_ID                 # Instagram user id (graph.instagram.com)
        sync: false
      - key: IG_ACCESS_TOKEN            # Instagram user token (Instagram-Login path)
        sync: false
      - key: IG_GRAPH_HOST
        value: graph.instagram.com
      - key: FB_PAGE_ID
        sync: false
      - key: FB_PAGE_ACCESS_TOKEN       # Facebook Page token (graph.facebook.com)
        sync: false
      - key: GRAPH_VERSION
        value: v25.0
      - key: GOOGLE_ACCESS_TOKEN        # GBP OAuth (refreshed via GOOGLE_REFRESH_TOKEN)
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID           # OAuth client id (for token refresh)
        sync: false
      - key: GOOGLE_CLIENT_SECRET       # OAuth client secret (SECRET)
        sync: false
      - key: GBP_ACCOUNT_ID
        sync: false
      - key: GBP_LOCATION_ID
        sync: false
      - key: AUTONOMY_PHASE
        value: A             # A = approval assertion. Worker currently waits for approval in every phase.
      - key: PUBLIC_BASE_URL            # public root HTTPS origin for approval links + immutable media
        value: https://gcd-social-api.onrender.com
      - key: ACTIVE_PLATFORMS           # IG+FB while GBP API access is pending; add gbp when approved
        value: instagram,facebook

  # 2) Orchestration worker — runs deterministic TypeScript orchestration and model calls. Long-running; persistent, not serverless.
  - type: worker
    name: gcd-social-worker
    runtime: node
    plan: standard           # 2GB — the Claude Agent SDK + image gen exceeds Starter's 512MB
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS            # heap headroom for the SDK on the 2GB worker instance
        value: --max-old-space-size=1536
      - key: DATABASE_URL
        fromDatabase:
          name: gcd-social-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: IMAGEGEN_API_KEY
        sync: false
      # Native publishing credentials (no aggregator).
      - key: IG_USER_ID
        sync: false
      - key: IG_ACCESS_TOKEN
        sync: false
      - key: IG_GRAPH_HOST
        value: graph.instagram.com
      - key: FB_PAGE_ID
        sync: false
      - key: FB_PAGE_ACCESS_TOKEN
        sync: false
      - key: GRAPH_VERSION
        value: v25.0
      - key: GOOGLE_ACCESS_TOKEN
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GBP_ACCOUNT_ID
        sync: false
      - key: GBP_LOCATION_ID
        sync: false
      - key: APPROVAL_CHANNEL_WEBHOOK
        sync: false
      - key: AUTONOMY_PHASE
        value: A
      - key: PUBLIC_BASE_URL
        value: https://gcd-social-api.onrender.com
      - key: ACTIVE_PLATFORMS
        value: instagram,facebook

  # 3) Daily scheduler — enqueues one themed brief per day (content calendar).
  #    It does NOT publish: the worker runs deterministic orchestration and
  #    waits for Slack approval before anything goes live.
  - type: cron
    name: gcd-social-scheduler
    runtime: node
    plan: starter
    schedule: "0 13 * * *"   # 13:00 UTC daily (~8–9 AM ET) — brief generated, approval lands mid-morning
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:scheduler
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL          # only needs the queue; the worker holds the posting creds
        fromDatabase:
          name: gcd-social-db
          property: connectionString

# Posting cadence: 1 brief/day via the gcd-social-scheduler cron → 1 post/platform/day
# (IG + FB now; + GBP once added to ACTIVE_PLATFORMS). Approval gate stays on (Phase A).
